[package]
name = "ai-usage"
version = "0.1.0"
description = "AI Usage Monitor desktop widget"
authors = ["AI Usage Monitor"]
edition = "2021"

[lib]
name = "ai_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
